[project]
name = "grounded-agent"
version = "0.1.0"
description = "A support-investigation agent that has to prove what it says: cited claims, a second-model check, human-approved writes and replayable evals."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.11",
]

[project.scripts]
grounded-agent = "grounded_agent.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
